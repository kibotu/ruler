name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Publish plugin locally
        run: ./gradlew :ruler:publishToMavenLocal

      - name: Run tests and sample check
        run: ./gradlew :ruler:test :sample:app:check --stacktrace
