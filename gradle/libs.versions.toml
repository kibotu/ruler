[libraries]
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version = "2.4.10" }
kotlin-daemonClient = { module = "org.jetbrains.kotlin:kotlin-daemon-client", version = "2.4.10" }
kotlin-daemonEmbeddable = { module = "org.jetbrains.kotlin:kotlin-daemon-embeddable", version = "2.4.10" }
android-gradlePlugin = { module = "com.android.tools.build:gradle", version = "9.5.0" }
android-tools-apkanalyzer = { module = "com.android.tools.apkparser:apkanalyzer", version = "32.3.1" }
android-tools-common = { module = "com.android.tools:common", version = "32.3.1" }
android-tools-sdklib = { module = "com.android.tools:sdklib", version = "32.3.1" }
bundletool = { module = "com.android.tools.build:bundletool", version = "1.18.2" }
dexlib = { module = "com.android.tools.smali:smali-dexlib2", version = "3.0.9" }
protobuf = { module = "com.google.protobuf:protobuf-java", version = "4.33.1" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }
snakeyaml = { module = "org.yaml:snakeyaml", version = "2.5" }

androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.2.1" }

junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version = "5.12.2" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version = "5.12.2" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params", version = "5.12.2" }
junit-platformLauncher = { module = "org.junit.platform:junit-platform-launcher", version = "1.12.2" }
truth = { module = "com.google.truth:truth", version = "1.4.4" }

[plugins]
android-application = { id = "com.android.application", version = "9.5.0" }
android-library = { id = "com.android.library", version = "9.5.0" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version = "2.4.10" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version = "2.4.10" }
pluginPublish = { id = "com.gradle.plugin-publish", version = "1.3.0" }
shadow = { id = "com.gradleup.shadow", version = "9.2.2" }
nexusPublish = { id = "io.github.gradle-nexus.publish-plugin", version = "2.0.0" }
