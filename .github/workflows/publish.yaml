name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      # Tags are written both as `3.0.0` and as `v3.0.0`; the artifact version never carries the v.
      - id: extract
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "Publishing version: ${VERSION#v}"

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew :ruler:build -Pversion=${{ needs.version.outputs.version }} --no-configuration-cache --no-daemon --stacktrace

  publish-maven-central:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      SONATYPE_USERNAME: ${{ secrets.MAVEN_CENTRAL_USER_NAME }}
      SONATYPE_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      PGP_SIGNING_KEY: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
      PGP_SIGNING_PASSWORD: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Central
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository -Pversion=${{ needs.version.outputs.version }} --no-configuration-cache --no-daemon --stacktrace

  publish-gradle-portal:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
      GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Publish to Gradle Plugin Portal
        run: ./gradlew :ruler:publishPlugins -Pversion=${{ needs.version.outputs.version }} --no-configuration-cache --no-daemon --stacktrace
